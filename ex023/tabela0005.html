<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
        <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }

        table{
            border-collapse: collapse;

        }
        caption{
            font-size: 1em;
            font-weight: bold;
            padding: 10px
        }
        th,td {
            border: 1px solid black;
            padding:10px;
        }
        td.destaque{
            background-color: rgb(231, 26, 15);
        }
       col.cnome{
        background-color: blue;
       }
       col.csexo{
        background-color: rgb(229, 226, 17);
       }



    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>

            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">

        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25 Anos</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Paloma</td>
            <td>F</td>
            <td>20</td>
            <td>Abastecedora</td>
        </tr>
        <tr>
            <td>Maurício</td>
            <td>M</td>
            <td>32</td>
            <td>Caminhoneiro</td>
        </tr>
        <tr >
            <td>Lucas</td>
            <td>M</td>
            <td>27</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Janaina</td>
            <td>F</td>
            <td>39</td>
            <td>Empresária</td>
        </tr>
        <tr>
            <td>João</td>
            <td>M</td>
            <td>22</td>
            <td>Pintor</td>
        </tr>
    </table>
</body>
</html>
